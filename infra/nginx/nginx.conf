worker_processes auto;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript text/xml
             application/xml image/svg+xml;

  client_max_body_size 1m;  # images go straight to the bucket, never through us

  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_x_request_id $req_id { default $http_x_request_id; '' $request_id; }

  upstream api { server api:8000; keepalive 32; }
  upstream web { server web:3000; keepalive 32; }

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: a client-supplied X-Forwarded-For must not pick its own IP (the
    # API rate-limits per IP). Behind an AWS ALB, configure the realip module instead.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
    proxy_set_header Connection "";

    location /api/v1/auth/ {
      limit_req zone=auth burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
    }

    location /api/ {
      proxy_pass http://api;
    }

    location /ws/ {
      proxy_pass http://api;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    location /_next/static/ {
      proxy_pass http://web;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      proxy_pass http://web;
    }
  }
}
