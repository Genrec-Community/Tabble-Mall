<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>You're offline · MallT</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #000; color: #fff; font-family: Montserrat, ui-sans-serif, system-ui, sans-serif; }
  main { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { margin: 8px 0 0; font-size: 1.5rem; }
  p { margin: 0; color: #e0e0e0; max-width: 22rem; line-height: 1.5; }
  button { margin-top: 12px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; font: inherit; font-weight: 700; color: #1a1408; background: linear-gradient(135deg, #ffa500, #ffb733); cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Your orders are safe. Your pickup code and order status will show again as soon as you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
